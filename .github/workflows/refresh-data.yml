name: refresh-data

# Tuesdays, the day after michi-binder rebuilds its Pokemon index.
on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests

      # Each bake stands alone: a broken source skips that game, the rest
      # still refresh and get committed. Every script refuses to write a
      # suspiciously small index, so a partial failure cannot wipe good data.
      # The last step then fails the run if any bake failed, so a dead
      # source shows up red instead of hiding behind a warning.
      - name: Pokemon EN index (from michi-binder)
        id: pokemon_en
        continue-on-error: true
        run: python3 scripts/build_pokemon.py
      - name: Pokemon zh species map
        id: pokemon_zh
        continue-on-error: true
        run: python3 scripts/build_pokemon_zh.py
      - name: Pokemon mainland prints (Cryst DB)
        id: pokemon_cn
        continue-on-error: true
        run: python3 scripts/build_pokemon_cn.py
      - name: One Piece (punk-records + official CN API)
        id: onepiece
        continue-on-error: true
        run: python3 scripts/build_onepiece.py
      - name: Riftbound (Riot gallery + official CN API)
        id: riftbound
        continue-on-error: true
        run: python3 scripts/build_riftbound.py

      - name: Commit changes
        run: |
          git config user.name "Shizukaziye"
          git config user.email "lxpi94@gmail.com"
          git add data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: weekly refresh"
          git push

      - name: Fail if any bake failed
        if: always()
        env:
          OUTCOMES: >-
            pokemon_en=${{ steps.pokemon_en.outcome }}
            pokemon_zh=${{ steps.pokemon_zh.outcome }}
            pokemon_cn=${{ steps.pokemon_cn.outcome }}
            onepiece=${{ steps.onepiece.outcome }}
            riftbound=${{ steps.riftbound.outcome }}
        run: |
          failed=""
          for kv in $OUTCOMES; do
            [ "${kv#*=}" = success ] || failed="$failed ${kv%%=*}(${kv#*=})"
          done
          if [ -n "$failed" ]; then
            echo "::error::bake failed:$failed"
            exit 1
          fi
          echo "all bakes succeeded"
